<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Linear Gradients for Premium Aesthetics -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="48" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- Outer Tech Ring (Obsidian Base + Cyan Glow) -->
  <circle cx="24" cy="24" r="21" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.35" fill="#09090b" />
  <circle cx="24" cy="24" r="18" stroke="url(#purpleGrad)" stroke-width="1" stroke-opacity="0.15" />

  <!-- Dotted Outer Compass Coordinates -->
  <circle cx="24" cy="4" r="1" fill="#00f0ff" />
  <circle cx="24" cy="44" r="1" fill="#00f0ff" />
  <circle cx="4" cy="24" r="1" fill="#00f0ff" />
  <circle cx="44" cy="24" r="1" fill="#00f0ff" />

  <!-- Cybernetic Chevron / Navigation Arrow (Main Active Shape) -->
  <!-- Top North Pointer (Vibrant Cyan) -->
  <path d="M24 10 L33 28 L24 23.5 Z" fill="url(#cyanGrad)" filter="url(#glow)" />
  <!-- Bottom South Pointer (Electric Purple) -->
  <path d="M24 38 L15 20 L24 24.5 Z" fill="url(#purpleGrad)" filter="url(#glow)" />

  <!-- Tech Intersection Node (Center Core) -->
  <circle cx="24" cy="24" r="2.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="24" cy="24" r="4.5" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.8" />
</svg>